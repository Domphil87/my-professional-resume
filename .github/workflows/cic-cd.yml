name: Build And Push to ECR

on:
    push:
        # pull_request:
        #    branches: [ 'main', 'dev' ]
            branches: ['main']         
permissions:
    id-token: write
    contents: read

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: dev-excel
  ECS_SERVICE: dev-excel-service-rwnkg02p
  TASK_DEFINITION: task-definition.json
  CONTAINER_NAME: excel

jobs:
    build_scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout the Code
              uses: actions/checkout@v4
            - name: Trivy Scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                scan-type: 'fs'
                severity: HIGH,CRITICAL
                exit-code: 1
            - name: Build Docker Image
              run: docker build -t ${{ secrets.ECR_REPO }}/my-repo:latest .
            
            - name: Scan Image with Trivy 
              uses: aquasecurity/trivy-action@v0.36.0 
              with: 
               image-ref: ${{ secrets.ECR_REPO }}/my-repo:latest
               format: table 
               exit-code: 0 
               ignore-unfixed: true 
               severity: CRITICAL,HIGH
            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4 # More information on this action can be found below in the 'AWS Credentials' section
              with:
                role-to-assume: ${{ secrets.AWS_ROLE }}
                aws-region: us-east-1
            - name: Login to Amazon ECR
              id: login-ecr
              uses: aws-actions/amazon-ecr-login@v2
            - name: Push Image to Ecr
              run: docker push ${{ secrets.ECR_REPO }}/my-repo:latest
    Deploy_to_ecs:
        needs: build_scan
        runs-on: ubuntu-latest

        steps:
            - name: Checkout the Code
              uses: actions/checkout@v4

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v4 # More information on this action can be found below in the 'AWS Credentials' section
              with:
                role-to-assume: ${{ secrets.AWS_ROLE }}
                aws-region: us-east-1

            - name: Render ECS Task Definition
              id: task-def
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                task-definition: ${{ env.TASK_DEFINITION }}
                container-name: ${{ env.CONTAINER_NAME }}
                image: ${{ secrets.ECR_REPO }}/my-repo:latest

            - name: Deploy to Ecs
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                task-definition: ${{ steps.task-def.outputs.task-definition }}
                service: ${{ env.ECS_SERVICE }}
                cluster: ${{ env.ECS_CLUSTER }}